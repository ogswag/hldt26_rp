server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Live project events (SSE): no buffering, and a read timeout longer than the 20 s heartbeat.
    location ~ ^/api/projects/[^/]+/events$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        error_page 502 503 504 = @api_down;
    }

    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        error_page 502 503 504 = @api_down;
    }

    # The API is down or not answering: the page gets the API's error shape, not nginx's HTML. Errors the API
    # itself returns pass through untouched (no proxy_intercept_errors).
    location @api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-Id $request_id always;
        return 503 '{"error":"Сервер не отвечает. Повторите через минуту.","code":"api_unavailable","request_id":"$request_id"}';
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    location = /version {
        proxy_pass http://api:8080/version;
        proxy_set_header Host $host;
    }

    # The worker decides when the app updates, so it must never be answered from a browser or proxy cache.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Built files carry a content hash in the name, so they can be kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

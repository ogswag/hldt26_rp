openapi: 3.0.3
info:
  title: Robot selection API
  version: 0.6.0
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /version:
    get:
      summary: API and model versions
      responses:
        "200":
          description: OK
  /api/solutions:
    get:
      summary: List catalog solutions
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: kind
          schema:
            type: string
        - in: query
          name: subtype
          schema:
            type: string
        - in: query
          name: vendor
          schema:
            type: string
        - in: query
          name: object_type
          schema:
            type: string
            enum: [warehouse, airport, hospital]
        - in: query
          name: min_payload_kg
          schema:
            type: number
        - in: query
          name: max_width_mm
          schema:
            type: number
        - in: query
          name: family
          description: Comma list of robot groups; a robot with no group counts as other.
          schema:
            type: string
            example: mobile,uav
        - in: query
          name: status
          description: Comma list of status codes (operation, piloting, rnd).
          schema:
            type: string
        - in: query
          name: specs_complete
          description: Only robots whose specs cover what matching needs.
          schema:
            type: boolean
        - in: query
          name: archived
          description: include adds archived robots (admin only, 403 otherwise).
          schema:
            type: string
            enum: [include]
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, price_rub, payload_kg]
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 500
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Solution"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
  /api/solutions/{solutionId}:
    get:
      summary: One catalog solution
      parameters:
        - in: path
          name: solutionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solution"
        "404":
          description: Not found
  /api/solutions/{solutionId}/image:
    get:
      summary: A robot's photo (public)
      description: >-
        JPEG, or PNG for a photo with transparency, at most 1 200 px on the longer side. The ETag is the photo's
        sha256; a request with `v` equal to it is cached for a year.
      parameters:
        - $ref: "#/components/parameters/SolutionID"
        - in: query
          name: v
          schema:
            type: string
      responses:
        "200":
          description: The photo
          content:
            image/jpeg: {}
            image/png: {}
        "304":
          description: Not modified
        "404":
          description: The robot has no photo
  /api/catalog/bundle:
    get:
      summary: The live catalog as the calculation engine takes it
      description: The ETag is the catalog's content hash; a request with a matching If-None-Match gets 304.
      responses:
        "200":
          description: Catalog bundle
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBundle"
        "304":
          description: Not modified
  /api/catalog/dictionaries:
    get:
      summary: Warehouse task and capability codes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryEntry"
                  capabilities:
                    type: array
                    items:
                      $ref: "#/components/schemas/DictionaryEntry"
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/CapabilityTaskRule"
                  fields:
                    description: The catalog fields in file column order, for the admin editor and uploads.
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogField"
  /api/object-types:
    get:
      summary: List object types
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [warehouse, airport, hospital]
                        label:
                          type: string
  /api/object-types/{type}/schema:
    get:
      summary: Parameter schema for an object type
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [warehouse, airport, hospital]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectSchema"
        "404":
          description: Unknown object type
  /api/guest/calculate:
    post:
      summary: Guest calculate (not persisted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_type, params]
              properties:
                object_type:
                  type: string
                  enum: [warehouse, airport, hospital]
                params:
                  type: object
                  additionalProperties: true
                seed:
                  type: integer
                  minimum: 0
                include_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                overrides:
                  $ref: "#/components/schemas/EconOverrides"
                schema_version:
                  type: integer
                  description: Operation schema version of collections. Required with collections, otherwise 409 schema_version.
                collections:
                  type: object
                  additionalProperties: true
                  description: |
                    The project as operation collections, as in GET /api/projects/{id}/snapshot. When present it replaces
                    params: the processes, variants with their fleets, financing, assumptions, shared costs and the
                    what-if come from it. It is checked as an import is and used once; nothing is stored.
      responses:
        "200":
          description: Structured result with econ, match, model econ-v3. Not persisted.
        "400":
          description: Validation error, or collections that do not pass the operation schema
        "409":
          description: Unsupported schema version (code schema_version)
  /api/engine/{file}:
    get:
      summary: A file of the browser build of the calculation engine
      description: >-
        The deployment image carries the WebAssembly engine and its loader next to the API. The page fetches
        them once and then matches, calculates and simulates in the browser when the server cannot be reached,
        marking such results as preliminary. A local `go run` has no such directory and answers 404, and the
        page keeps calculating on the server.
      parameters:
        - in: path
          name: file
          required: true
          description: The file name alone; a path or ".." is refused.
          schema:
            type: string
            example: engine.wasm
      responses:
        "200":
          description: The file, with Cache-Control public, max-age=3600
          content:
            application/wasm:
              schema:
                type: string
                format: binary
            application/javascript:
              schema:
                type: string
        "404":
          description: No such file, or this deployment carries no browser engine
  /api/guest/match:
    post:
      summary: Guest matching (not persisted)
      parameters:
        - $ref: "#/components/parameters/MatchView"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_type, params]
              properties:
                object_type:
                  type: string
                  enum: [warehouse, airport, hospital]
                params:
                  type: object
                  additionalProperties: true
                include_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                task_codes:
                  type: array
                  items:
                    type: string
                    enum: [pallet_inbound, pallet_putaway, pallet_outbound, pallet_move, piece_pick, cleaning]
      responses:
        "200":
          description: Ranked catalog with hard, soft, missing_evidence and explanation chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchOutput"
        "400":
          description: Validation error
  /api/auth/register:
    post:
      summary: Register a user and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                invite_token:
                  type: string
                  description: Token from an invitation letter. Required when REGISTRATION_MODE is invite.
      responses:
        "200":
          description: Session started; the cookie is in Set-Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid input
        "403":
          description: Cross-site request (code csrf), or registration is by invitation only (code invite_required)
        "409":
          description: Email already registered
  /api/auth/login:
    post:
      summary: Log in and start a session
      description: A session cookie already on the request is revoked and replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Session started; the cookie is in Set-Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Bad credentials (the same text for an unknown email)
        "403":
          description: Cross-site request (code csrf)
  /api/auth/me:
    get:
      summary: Current user and the session's CSRF token
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not signed in, or the session expired (code session_expired)
  /api/auth/logout:
    post:
      summary: Revoke the current session and clear the cookie
      description: Succeeds without a session too.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logged out
        "403":
          description: Missing CSRF token (code csrf)
  /api/auth/verify-email:
    post:
      summary: Confirm an email address with the token from its letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Confirmed
        "400":
          description: No token
        "410":
          description: The token is used or expired
  /api/auth/verify-email/resend:
    post:
      summary: Send the confirmation letter again
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The address is already confirmed
        "202":
          description: Letter queued
        "401":
          description: Not signed in
  /api/auth/password-reset/request:
    post:
      summary: Ask for a password link
      description: Always answers the same way, so it never says which addresses exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "202":
          description: Accepted
  /api/auth/password-reset/confirm:
    post:
      summary: Set a new password with the token from the letter
      description: Every session of that account ends, including the caller's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "200":
          description: Password changed
        "400":
          description: Invalid input
        "410":
          description: The token is used or expired
  /api/auth/invitations/inspect:
    post:
      summary: What an invitation token stands for, for the registration page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: The invitation, or why it cannot be used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCheck"
        "400":
          description: No token
  /api/dev/outbox:
    get:
      summary: Letters queued for one address (only when APP_ENV is local)
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Letters, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutboxLetter"
        "404":
          description: Not served outside a local run
  /api/auth/sessions:
    get:
      summary: Active sessions of the current user, most recently used first
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          description: Not signed in
  /api/auth/sessions/{sessionId}:
    delete:
      summary: Revoke one of the current user's sessions
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked; the cookie is cleared when it was the current session
        "401":
          description: Not signed in
        "403":
          description: Missing CSRF token (code csrf)
        "404":
          description: No such active session of this user
  /api/auth/sessions/revoke-others:
    post:
      summary: Revoke every session of the current user except this one
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Number of revoked sessions
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        "401":
          description: Not signed in
        "403":
          description: Missing CSRF token (code csrf)
  /api/guest/export:
    post:
      summary: Guest PDF or XLSX (not persisted)
      description: >-
        Financial report for a decision maker, built from the request and stored nowhere. Same content as
        POST /api/calculations/{runId}/export, without a run: no X-Run-Id header, the project is named "Не сохранён",
        the file is named ocenka-warehouse.xlsx after the object type.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [pdf, xlsx]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_type, params]
              properties:
                object_type:
                  type: string
                  enum: [warehouse, airport, hospital]
                params:
                  type: object
                  additionalProperties: true
                seed:
                  type: integer
                  minimum: 0
                include_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                overrides:
                  $ref: "#/components/schemas/EconOverrides"
                schema_version:
                  type: integer
                  description: Operation schema version of collections. Required with collections, otherwise 409 schema_version.
                collections:
                  type: object
                  additionalProperties: true
                  description: |
                    The project as operation collections, as in GET /api/projects/{id}/snapshot. When present it replaces
                    params: the processes, variants with their fleets, financing, assumptions, shared costs and the
                    what-if come from it. It is checked as an import is and used once; nothing is stored.
      responses:
        "200":
          description: >-
            PDF (up to two pages for a typical project) or XLSX with the sheets Итог, Варианты, Допущения и риски.
            Money is numeric in XLSX and shown with the ruble sign.
        "400":
          description: Validation error, or collections that do not pass the operation schema
        "409":
          description: Unsupported schema version (code schema_version)
  /api/projects:
    get:
      summary: List own projects and projects shared with the caller
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Items carry access (owner, editor or viewer)
        "403":
          description: Guest cannot list projects
    post:
      summary: Create a project (owner)
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Created
        "400":
          description: Invalid input
        "403":
          description: Guest cannot persist a project
  /api/projects/trash:
    get:
      summary: Own projects in the trash, newest first
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Trash
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrashItem"
        "401":
          description: Not signed in
  /api/projects/import:
    post:
      summary: Create a project from a snapshot of the browser store (user or admin)
      description: >-
        A guest works without an account and everything they enter stays in their browser. After they sign in,
        "Сохранить в аккаунт" sends the snapshot here. The records arrive through the operation schema, exactly
        as an edit would, and the project is created and filled in one database transaction: a snapshot the
        schema refuses leaves nothing behind. Identifiers are renewed, so the same snapshot can be saved twice.
        The body is at most 1 MB; name comes from the request, or from the snapshot's project record.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema_version, collections]
              properties:
                name:
                  type: string
                schema_version:
                  type: integer
                collections:
                  type: object
                  description: The collections of GET /api/projects/{id}/snapshot
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: >-
            The snapshot did not pass the schema (code is the rejection reason, details name the operation),
            or its object type or parameters are invalid
        "403":
          description: Guest cannot save a project
        "409":
          description: Schema version mismatch (code schema_version)
        "413":
          description: Snapshot larger than 1 MB
  /api/projects/{id}/restore:
    post:
      summary: Take own project out of the trash (owner)
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The restored project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found, or not in the trash
        "410":
          description: Deleted longer ago than the retention
  /api/projects/{id}/purge:
    delete:
      summary: Delete own project for good (owner)
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found, or not in the trash
  /api/projects/{id}:
    get:
      summary: Get own project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project with draft, stale flag and last run pointer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Guest cannot read a project
        "404":
          description: Not found
    delete:
      summary: Move own project to the trash (owner)
      description: Queued and running simulation jobs are canceled and the project streams close. The project is
        kept for TRASH_RETENTION_DAYS (30 by default) and can be restored until then.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: In the trash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashedProject"
        "403":
          description: Guest cannot delete a project, or the caller is not the owner
        "404":
          description: Not found
        "410":
          description: Already in the trash (code project_deleted)
  /api/projects/{id}/transactions:
    post:
      summary: Apply a batch of operation transactions (editor or owner)
      description: >
        Transactions apply in order, each whole or not at all, against the schema in
        contracts/ops/project.schema.json (docs/adr/0003-operations-and-sync.md). An applied
        transaction takes the next seq; a rejected one is stored with its reason and no seq.
        A tx_id seen before returns its stored outcome, so resending a batch after a lost
        response is safe. A malformed operation rejects its own transaction with
        invalid_value, not the batch.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, schema_version, txs]
              additionalProperties: false
              properties:
                client_id:
                  type: string
                  maxLength: 64
                schema_version:
                  type: integer
                  description: Must equal the server schema version, otherwise 409 schema_version
                txs:
                  type: array
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/OpTransaction"
      responses:
        "200":
          description: One result per transaction, in request order, and the project's seq after the batch
          content:
            application/json:
              schema:
                type: object
                required: [results, seq]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpResult"
                  seq:
                    type: integer
                    format: int64
        "400":
          description: Invalid envelope (client_id, tx_id not lowercase UUID, more than 200 transactions)
        "403":
          description: Viewer (code forbidden), guest, or missing CSRF token (code csrf)
        "404":
          description: Project not found or no access
        "409":
          description: Unsupported schema version (code schema_version)
        "413":
          description: Body larger than 1 MB
  /api/projects/{id}/snapshot:
    get:
      summary: Every record of the project as operation collections, with the seq they belong to
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, seq, collections]
                properties:
                  schema_version:
                    type: integer
                  seq:
                    type: integer
                    format: int64
                  collections:
                    type: object
                    description: Collection name to an object of records by id (contracts/ops/project.schema.json)
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties: true
        "404":
          description: Project not found or no access
  /api/projects/{id}/operations:
    get:
      summary: Accepted transactions after a seq, in order
      description: >
        reset true means the client takes a new snapshot instead: the range holds a write
        made outside operations, part of it is older than the 30-day journal, or after is
        past the project's seq. Items are then empty.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - in: query
          name: after
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: Journal page
          content:
            application/json:
              schema:
                type: object
                required: [items, seq, reset]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [seq, tx_id, client_id, actor, actor_email, label, ops, created_at]
                      properties:
                        seq:
                          type: integer
                          format: int64
                        tx_id:
                          type: string
                          format: uuid
                        client_id:
                          type: string
                          description: '"server" for changes the server made itself (calculation, match)'
                        actor:
                          type: string
                          format: uuid
                          nullable: true
                        actor_email:
                          type: string
                          nullable: true
                          description: The actor's email; null when the server made the change or the account is gone
                        label:
                          type: string
                        ops:
                          type: array
                          items:
                            $ref: "#/components/schemas/Op"
                        created_at:
                          type: string
                          format: date-time
                  seq:
                    type: integer
                    format: int64
                    description: The project's current seq
                  reset:
                    type: boolean
        "400":
          description: Invalid after or limit
        "404":
          description: Project not found or no access
  /api/projects/{id}/events:
    get:
      summary: Live project events (Server-Sent Events)
      description: >
        text/event-stream. The first events are ops {seq} with the project's current seq and
        presence {list}. Then: ops {seq} after each accepted transaction or journaled server
        change (fetch /operations after your seq); presence {list}; runs {} when calculations
        or simulation jobs change; access {role} when your role changes (role null means the
        access is gone and the stream ends); deleted {} and the stream ends; reset {} after the
        server lost notifications, so re-read /operations. A ": ping" comment every 20 s keeps
        the connection open; the stream ends when the session is revoked. At most 20 open
        streams per user (429).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Project not found or no access
        "429":
          description: Too many open streams for this user
        "503":
          description: Live updates are not available
  /api/projects/{id}/presence:
    post:
      summary: Report where this tab is in the project (any role)
      description: >
        Send every 15 s and on change. An entry expires 45 s after its last report; leave true
        removes it at once (send it with fetch keepalive on page hide). Streams receive the
        list at most every 250 ms.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              additionalProperties: false
              properties:
                client_id:
                  type: string
                  maxLength: 64
                route:
                  type: string
                  maxLength: 200
                selection:
                  type: object
                  nullable: true
                  required: [coll, id]
                  additionalProperties: false
                  properties:
                    coll:
                      type: string
                    id:
                      type: string
                leave:
                  type: boolean
      responses:
        "204":
          description: Reported
        "400":
          description: Invalid body
        "404":
          description: Project not found or no access
  /api/projects/{id}/copy:
    post:
      summary: Copy own project
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created
        "403":
          description: Guest cannot copy a project
        "404":
          description: Not found
  /api/projects/{id}/export:
    post:
      summary: Report of the current calculation run
      description: >-
        Same financial report as POST /api/calculations/{runId}/export for projects.current_run_id. The report is built
        from the run snapshot, not from the draft, and is refused while the draft differs from the run (code stale_result).
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: format
          schema:
            type: string
            enum: [pdf, xlsx]
      responses:
        "200":
          description: >-
            PDF or XLSX report. Content-Disposition names the file after the object type and the project version number, for example raschet-warehouse-3.xlsx.
          headers:
            X-Run-Id:
              description: Run the report was built from
              schema:
                type: string
                format: uuid
            X-Input-Hash:
              description: input_hash of the run snapshot
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: No calculation run yet
        "403":
          description: Guest cannot export a project
        "404":
          description: Not found
        "409":
          description: >-
            Current draft is stale (code stale_result). Export a historical run by run id or recalculate.

  /api/calculations/{runId}/export:
    post:
      summary: Report of one calculation run, also when the draft is stale
      description: >-
        Financial report for a decision maker. It compares the baseline and calculated variants, shows initial investment,
        annual costs, annual cash effect, simple payback, costs for the horizon, decision-relevant assumptions and risks.
        The highlighted variant is the non-baseline scenario with a positive annual effect and the shortest simple payback
        within the horizon; equal paybacks and paybacks beyond the horizon highlight none, and the report says so.
        XLSX sheets: Итог, Варианты, Допущения и риски. The immutable run snapshot remains stored in the system.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: format
          schema:
            type: string
            enum: [pdf, xlsx]
      responses:
        "200":
          description: >-
            PDF or XLSX report. Content-Disposition names the file after the object type and the project version number, for example raschet-warehouse-3.xlsx.
          headers:
            X-Run-Id:
              description: Run the report was built from
              schema:
                type: string
                format: uuid
            X-Input-Hash:
              description: input_hash of the run snapshot
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          description: Guest
        "404":
          description: Not found, not owned, or a simulation run
  /api/projects/{id}/runs:
    get:

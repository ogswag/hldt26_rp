  /api/projects/{id}/sim-checks:
    get:
      summary: Compare each warehouse variant with its latest simulation
      description: >-
        For every variant that has a fleet, takes the latest sim-v2 run made for the current inputs of that
        variant and compares what the fleet delivered with what the economics counts on. A variant whose only
        runs are older is reported as stale, a variant nobody simulated has no run. The list is built when it is
        read, so a run that ends after a calculation shows up without recalculating. Other object types are
        checked during the calculation and return an empty list here.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One check per variant with a fleet
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SimCheck"
        "404":
          description: Not found
  /api/projects/{id}/simulations:
    post:
      summary: Enqueue a sim-v2 run for one variant
      description: >-
        The server validates the config, the map and the fleet, stores an immutable project version,
        a calculation run of kind simulation and a job. The HTTP request does not wait for the run.
        One active job per project; SIM_MAX_ACTIVE_PER_USER active jobs per user.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationCreateResponse"
        "400":
          description: >-
            Invalid config, empty variant, unsupported object type or map errors.
            Map errors use code map_invalid and carry issues.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [map_invalid, validation_error]
                  request_id:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/MapIssue"
        "403":
          description: Guest
        "404":
          description: Not found
        "409":
          description: The project already has an active simulation
        "429":
          description: Too many active simulations for the user
        "503":
          description: Worker pool is not running
    get:
      summary: Simulation history of a project, newest first (up to 50)
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Jobs with run hash, stale flag and a short result
          content:
            application/json:
              schema:
                type: object
                required: [items, input_hash]
                properties:
                  input_hash:
                    type: string
                    description: Current draft hash
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/SimulationJob"
                        - type: object
                          properties:
                            input_hash:
                              type: string
                            seed:
                              type: integer
                            sim_version:
                              type: string
                            project_version_id:
                              type: string
                              format: uuid
                            stale_vs_draft:
                              type: boolean
                            brief:
                              type: object
                              description: verdict, verdict_text, kpi, fleet, variant_name and map_source of the result; null fields while running
        "403":
          description: Guest
        "404":
          description: Not found
